<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arithmetic Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Simple Arithmetic Calculator</h1>

    <p class="question">
        What do you want to do?
    </p>

    <div class="buttons">

        <button onclick="selectOperation('+')">
            Addition
        </button>

        <button onclick="selectOperation('-')">
            Subtraction
        </button>

        <button onclick="selectOperation('*')">
            Multiplication
        </button>

        <button onclick="selectOperation('/')">
            Division
        </button>

    </div>

    <div class="calculator" id="calculator">

        <h2 id="operationName">
            Selected Operation
        </h2>

        <input
            type="number"
            id="num1"
            placeholder="Enter First Number">

        <input
            type="number"
            id="num2"
            placeholder="Enter Second Number">

        <button class="calculate" onclick="calculate()">
            Calculate
        </button>

        <button class="clear" onclick="clearAll()">
            Clear
        </button>

        <h2 id="result">
            Result :
        </h2>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
